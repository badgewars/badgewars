<html lang="en">

<title>Badge Wars — courtroom layout study</title>
<style>
:root{color-scheme:light;--paper:#f5f1e9;--ink:#252723;--muted:#717568;--line:#d9d7cd;--brass:#ad873e;--white:#fffefa;--night:#252d3a}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.45}button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #95722b;outline-offset:3px}button{color:inherit}a{color:inherit}.review{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 24px;background:#e7e4dd;border-bottom:1px solid var(--line);font-size:12px}.review strong{margin-right:auto}.review select,.review button{padding:7px 10px;border:1px solid #c8c6bc;background:#faf8f1;border-radius:5px}.review label{display:flex;align-items:center;gap:6px}.header{display:flex;align-items:center;gap:20px;padding:18px 28px;border-bottom:1px solid var(--line);background:var(--white)}.brand{font-family:Georgia,serif;font-weight:bold;font-size:25px;letter-spacing:-1px}.brand span{font-family:inherit;color:var(--brass)}.event{color:var(--muted);font-size:12px;margin-right:auto}.phaseTag{font-weight:650;letter-spacing:.04em}.timer{font-variant-numeric:tabular-nums;font-size:20px;border-left:1px solid var(--line);padding-left:20px}.quiet{font-size:12px;color:var(--muted)}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 350px;grid-template-rows:minmax(0,1fr) auto;gap:0;max-width:1680px;margin:auto;min-height:710px;height:calc(100dvh - 130px)}.arena{padding:18px 24px 12px;overflow:auto;min-width:0}.roomTitle{display:flex;justify-content:space-between;gap:12px;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:16px}.floor{display:grid;grid-template-columns:86px minmax(0,1fr) 86px;grid-template-rows:auto minmax(220px,1fr) auto;gap:12px;min-height:505px;border:1px solid #d0cec3;padding:15px;border-radius:18px;background:linear-gradient(135deg,#e9e5da,#f9f5ec 48%,#e4ded1);box-shadow:inset 0 0 0 5px #f3eee4;transition:background .3s}.row{grid-column:1/-1;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}.side{display:grid;gap:6px;grid-template-rows:repeat(4,1fr)}.seat{padding:4px;border:1px solid transparent;border-radius:8px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0;min-height:48px}.seat:hover{background:#fff9}.seat[aria-pressed=true]{border-color:var(--brass);background:#fff8e5}.seat.out{opacity:.45}.seat .mini{width:38px;height:44px;border-radius:7px 7px 3px 3px;display:grid;place-items:center;background:linear-gradient(135deg,#d7d6cb,#faf7ed);border:1px solid #b9bcad;font-family:Georgia,serif;font-size:17px;position:relative}.seat .mini:after{content:"";position:absolute;right:-3px;bottom:-2px;width:9px;height:11px;background:var(--brass);clip-path:polygon(50% 0,100% 20%,90% 70%,50% 100%,10% 70%,0 20%)}.seat.out .mini:after{display:none}.seatName{font-size:10px;line-height:1.2;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}.seatStatus{font-size:9px;color:var(--muted)}.side .seat{flex-direction:row;gap:6px}.side .mini{width:27px;height:32px;font-size:12px;flex-shrink:0}.side .seatName{white-space:normal;max-width:44px;font-size:9px}.spotlight{border:1px solid #cfccc0;box-shadow:0 4px 14px #6c614510,inset 0 0 0 6px #f4f0e5;border-radius:44%;padding:18px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:#fbf8f0;min-width:0;position:relative}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:var(--muted);margin:0 0 8px}.portrait{width:95px;height:116px;display:flex;flex-direction:column;justify-content:center;align-items:center;border:1px solid #b4b8aa;border-radius:10px;background:linear-gradient(140deg,#c7cabd,#f4f0e5);box-shadow:5px 5px 0 #d4cbb7;color:#515a4c}.portrait b{font:48px Georgia,serif;letter-spacing:-4px}.portrait small{font-size:8px;text-transform:uppercase;letter-spacing:1px}.spotlight h1{font:26px/1.2 Georgia,serif;margin:12px 0 4px}.spotlight p.context{font-size:12px;margin:2px 0;max-width:290px}.spotlight .outline{font-size:11px;padding:5px 10px;min-height:32px;margin-top:8px}.gallery{margin-top:14px;display:flex;gap:14px;align-items:center;min-height:68px}.galleryLabel{font-size:10px;letter-spacing:.1em;color:var(--muted);max-width:72px}.galleryList{display:flex;gap:10px;overflow:auto}.gallery .seat{min-width:58px}.gallery .mini{height:31px;width:28px;font-size:12px}.gallery .seat.out{opacity:.7}.actionbar{grid-column:1;padding:14px 24px;border-top:1px solid var(--line);background:var(--white);display:flex;gap:14px;align-items:center;min-height:84px}.actioncopy{flex:1;min-width:0}.actioncopy strong{display:block;font-size:13px}.actioncopy small{display:block;font-size:11px;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.primary,.outline,.danger{padding:10px 16px;min-height:44px;border:1px solid var(--ink);border-radius:5px;background:var(--ink);color:white;font-size:12px;font-weight:600}.outline{background:transparent;color:var(--ink);border-color:#c7c9bd}.danger{background:#854a3c;border-color:#854a3c}.chat{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;background:var(--white);border-left:1px solid var(--line);min-height:0}.chatTop{padding:20px 20px 12px;border-bottom:1px solid var(--line)}.chatHeading{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:12px}.chatTabs{display:flex;gap:8px}.tab{border:0;background:transparent;color:var(--muted);border-bottom:2px solid transparent;padding:7px 3px;min-height:40px;font-size:12px}.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--brass);font-weight:650}.messages{padding:16px 20px;flex:1;overflow:auto;min-height:220px}.message{margin-bottom:20px}.message header{display:flex;gap:8px;font-size:11px;align-items:center;margin-bottom:4px}.message header button{padding:0;background:none;border:0;font-weight:650;min-height:24px}.message time{color:var(--muted);font-size:10px;margin-left:auto}.message p{margin:0;font-size:13px;line-height:1.65;overflow-wrap:anywhere}.message.eventLine{padding:9px 10px;background:#f0eee5;border-left:2px solid var(--brass);font-size:11px}.chatNotice{font-size:11px;color:var(--muted);padding:9px 20px;border-top:1px solid var(--line)}.composer{display:flex;gap:8px;padding:12px 16px 18px}.composer input{min-width:0;flex:1;background:#f6f4ed;border:1px solid var(--line);padding:11px;border-radius:5px}.composer button{padding:9px 12px}.toast{font-size:12px;margin:0;padding:0 24px;background:#eee7d6;min-height:0}.toast:not(:empty){padding:10px 24px}.mobileNav,.compactRoster{display:none}.night .floor{background:linear-gradient(140deg,#394152,#252d3a);box-shadow:inset 0 0 0 5px #41495a;border-color:#5b6270}.night .floor .seatName,.night .floor .seatStatus{color:#e4e5de}.night .floor .seat[aria-pressed=true] .seatName,.night .floor .seat[aria-pressed=true] .seatStatus{color:var(--ink)}.night .spotlight{background:#eef0e8;box-shadow:inset 0 0 0 6px #dcded7}.night .floor .seat:hover{background:#ffffff24}dialog{border:1px solid var(--line);border-radius:12px;padding:26px;max-width:min(440px,90vw);box-shadow:0 20px 80px #0003;background:var(--white)}dialog::backdrop{background:#20282066}dialog h2{font-family:Georgia,serif;font-weight:normal}dialog p{font-size:14px}dialog .primary{margin-top:10px}.roles{font-size:10px;color:#744e16}
@media(min-width:1600px){.floor{min-height:570px}.portrait{width:125px;height:155px}.spotlight h1{font-size:32px}}
@media(max-width:1100px){.workspace{grid-template-columns:minmax(0,1fr) 310px}.arena{padding:14px}.floor{grid-template-columns:64px minmax(0,1fr) 64px;padding:10px;gap:6px}.row{gap:2px}.seatName{font-size:9px}.side .seat{flex-direction:column}.side .seatName{max-width:58px}.actionbar{padding:12px 14px}.portrait{width:80px;height:96px}.spotlight{padding:12px}.spotlight h1{font-size:23px}}
@media(max-width:900px){.review{padding:8px 12px;gap:7px}.review strong{width:100%;font-size:10px}.review label{font-size:10px}.review select,.review button{max-width:135px;padding:6px;font-size:11px}.header{padding:12px 16px;gap:12px}.brand{font-size:22px}.event{display:none}.phaseTag{margin-left:auto;font-size:11px}.timer{font-size:16px;padding-left:12px}.mobileNav{display:flex;padding:0 16px;border-bottom:1px solid var(--line);background:var(--white);gap:22px}.workspace{display:flex;flex-direction:column;height:calc(100dvh - 193px);min-height:480px}.arena{flex:1;overflow:auto;padding:14px}.floor{display:block;min-height:260px;padding:12px}.floor>.row,.floor>.side{display:none}.spotlight{min-height:270px;border-radius:24%;padding:18px}.portrait{width:92px;height:110px}.roomTitle{font-size:9px;margin-bottom:10px}.compactRoster{display:block;margin-top:12px;border:1px solid var(--line);border-radius:7px;padding:8px}.compactRoster summary{min-height:32px;cursor:pointer;font-size:12px}.rosterGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}.rosterGrid .seatName{font-size:11px}.rosterGrid .seat{min-height:78px}.gallery{gap:8px;margin-top:10px}.actionbar{flex-shrink:0;padding:12px 14px max(12px,env(safe-area-inset-bottom));gap:8px;flex-wrap:wrap;position:sticky;bottom:0}.actioncopy{flex-basis:100%}.actions{width:100%}.actions>button{flex:1}.chat{flex:1;border-left:0;min-height:0}.workspace[data-panel=court] .chat{display:none}.workspace[data-panel=chat] .arena{display:none}.chatTop{padding:12px 16px 8px}.messages{min-height:100px}.chatNotice{padding:7px 16px}.composer{padding:10px 14px}.toast:not(:empty){padding:8px 14px;font-size:11px}.header .outline{padding:5px 8px;font-size:10px;min-height:34px}.review button{margin-left:auto}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="review"><strong>LAYOUT STUDY · fictional fixture · portrait placeholders</strong><label>View <select id="perspective" aria-label="Review perspective"><option value="detective">Detective</option><option value="citizen">Citizen</option><option value="doctor">Doctor</option><option value="mafia">Mafia</option><option value="accused">Accused Citizen</option><option value="gallery">Gallery</option><option value="audience">Audience</option></select></label><label>Phase <select id="phase" aria-label="Review phase"><option value="discussion">Discussion</option><option value="accusation">Accusation</option><option value="defense">Defense</option><option value="verdict">Verdict</option><option value="night">Night</option><option value="morning">Morning</option><option value="finale">Finale</option></select></label><button id="next" type="button">Next phase →</button></div>
<header class="header"><div class="brand">badge<span>wars</span></div><div class="event">The courtroom<br><span class="quiet">Sample match · Round 3</span></div><div class="phaseTag" id="phaseName">DISCUSSION</div><div class="timer" id="clock" aria-label="Illustrative phase time">03:00</div><button class="outline" id="roleButton" type="button">My role</button></header>
<nav class="mobileNav" aria-label="Mobile view"><button class="tab" id="courtNav" aria-selected="true">Court</button><button class="tab" id="chatNav" aria-selected="false">Chat</button></nav>
<p class="toast" id="notice" role="status" aria-live="polite"></p>
<main class="workspace" id="workspace" data-panel="court">
<section class="arena" aria-label="Courtroom"><div class="roomTitle"><span>24 members · one table</span><span id="castCount">20 active / 4 gallery</span></div><div class="floor"><div class="row" id="topSeats"></div><div class="side" id="leftSeats"></div><article class="spotlight" id="spotlight"><p class="eyebrow" id="focusLabel"></p><div class="portrait" aria-label="Schematic portrait placeholder"><b id="portraitInitial"></b><small>Portrait study</small></div><h1 id="focusName"></h1><p class="context" id="focusContext"></p><button class="outline" id="historyButton" type="button">Public history</button></article><div class="side" id="rightSeats"></div><div class="row" id="bottomSeats"></div></div><details class="compactRoster"><summary>All 24 members · select a portrait</summary><div class="rosterGrid" id="mobileSeats"></div></details><div class="gallery"><span class="galleryLabel">GALLERY<br>No vote</span><div class="galleryList" id="gallerySeats"></div></div></section>
<aside class="chat" aria-label="Chat"><div class="chatTop"><div class="chatHeading"><strong id="chatHeading">MATCH CHAT</strong><span class="quiet" id="viewLabel"></span></div><div class="chatTabs" id="chatTabs" role="tablist" aria-label="Chat channels"></div></div><div class="messages" id="messages" role="log" aria-label="Conversation"></div><div class="chatNotice" id="chatNotice"></div><form class="composer" id="composer"><input id="messageInput" maxlength="240" aria-label="Message" placeholder="Write a message…" autocomplete="off"><button class="primary" type="submit" id="send">Send</button></form></aside>
<footer class="actionbar"><div class="actioncopy"><strong id="actionTitle"></strong><small id="actionHint"></small></div><div class="actions" id="actions"></div></footer>
</main>
<dialog id="detailDialog"><p class="eyebrow" id="dialogLabel"></p><h2 id="dialogTitle"></h2><p id="dialogBody"></p><form method="dialog"><button class="primary">Close</button></form></dialog>
<script>
'use strict';
// Presentation fixtures only. This file intentionally has no transport, wallet,
// authoritative game engine, real identities, or production security boundary.
const $=id=>document.getElementById(id);
const names=Array.from({length:24},(_,i)=>`Member ${String(i+1).padStart(2,'0')}`);
names[2]='JiWoo';names[6]='NaKyoung';names[7]='Yubin';names[13]='Sohyun';
const removed=new Set([4,11,16,21]);
const mafiaFixture=new Set([0,3,10,13,18,22]);
const phases=['discussion','accusation','defense','verdict','night','morning','finale'];
const clocks={discussion:'03:00',accusation:'00:30',defense:'00:30',verdict:'00:30',night:'00:45',morning:'00:15',finale:'—'};
const state={view:'detective',phase:'discussion',selected:6,channel:'match',panel:'court',choice:null,prediction:null,nightAction:null};
const chats={match:[{event:'Discussion opens. Roles remain hidden.'},{who:'Yubin',seat:7,text:'You accused JiWoo yesterday. What changed?',time:'00:18'},{who:'NaKyoung',seat:6,text:'Her vote matched her explanation. I am more suspicious of the people who stayed quiet.',time:'00:27'},{who:'JiWoo',seat:2,text:'Look at the first vote. I chose Spare before anyone defended me.',time:'00:39'},{who:'Member 05',seat:4,text:'I lost my badge, but I can still help. Read the accusations together.',time:'00:51'},{who:'Sohyun',seat:13,text:'We need a clear reason before removing someone else.',time:'01:03'}],audience:[{event:'Audience conversation is separate from the cast.'},{who:'WAV 104',text:'NaKyoung has an answer for everything. I am saving my prediction until the defense.',time:'01:04'},{who:'WAV 219',text:'The change in voting is more interesting than who is talking the most.',time:'01:12'}],mafia:[{event:'Private fixture channel · active Mafia only.'},{who:'Mafia teammate',text:'Choose a target before the night timer closes.',time:'00:08'}]};
function memberRole(i){return mafiaFixture.has(i)?'Mafia':i===7?'Detective':i===19?'Doctor':'Citizen';}
function ownSeat(){return state.view==='accused'?6:state.view==='gallery'?4:state.view==='doctor'?19:state.view==='mafia'?0:7;}
function isAudience(){return state.view==='audience';}
function isActive(){return !['audience','gallery'].includes(state.view);}
function note(text){$('notice').textContent=text;}
function dialog(label,title,body){$('dialogLabel').textContent=label;$('dialogTitle').textContent=title;$('dialogBody').textContent=body;if(!$('detailDialog').open)$('detailDialog').showModal();}
function history(i){dialog('Public member history',names[i],removed.has(i)?'In the gallery. Their role is still hidden. They may join discussion but have no trial vote.':`Sample record: ${names[i]} voted Spare in round 2. Accusations and locked ballots appear here after their public reveal. No private roles or targets belong in this view.`);}
function selectSeat(i){if(['defense','verdict'].includes(state.phase)){history(i);return;}state.selected=i;renderStage();renderAction();}
function createSeat(i){const b=document.createElement('button');b.type='button';b.className='seat'+(removed.has(i)?' out':'');b.setAttribute('aria-label',`${names[i]}, ${removed.has(i)?'gallery':'active'}`);b.setAttribute('aria-pressed',String(state.selected===i));const p=document.createElement('span');p.className='mini';p.textContent=names[i].startsWith('Member')?String(i+1).padStart(2,'0'):names[i].slice(0,1);const n=document.createElement('span');n.className='seatName';n.textContent=names[i];b.append(p,n);if(state.phase==='finale'){const r=document.createElement('span');r.className='roles';r.textContent=memberRole(i);b.append(r);}b.onclick=()=>selectSeat(i);return b;}
function renderStage(){document.body.classList.toggle('night',state.phase==='night');for(const [id,ids] of Object.entries({topSeats:[0,1,2,3,4,5,6,7],leftSeats:[8,9,10,11],rightSeats:[12,13,14,15],bottomSeats:[16,17,18,19,20,21,22,23],mobileSeats:names.map((_,i)=>i),gallerySeats:[...removed]})){const target=$(id);target.replaceChildren(...ids.map(createSeat));}const forced=['defense','verdict'].includes(state.phase);const i=forced?6:state.selected;const focus=state.phase==='finale'?'Final reveal':forced?'On trial':state.phase==='night'?'Your private selection':'Selected member';$('focusLabel').textContent=focus;$('focusName').textContent=names[i];$('portraitInitial').textContent=names[i].startsWith('Member')?String(i+1).padStart(2,'0'):names[i].slice(0,1);$('focusContext').textContent=state.phase==='finale'?`${memberRole(i)} · sample final-role view`:forced?'“Read my first vote. I have been consistent.”':state.phase==='night'?'Only your own view shows this selection.':removed.has(i)?'In the gallery · role unknown':'Active · role unknown';$('historyButton').onclick=()=>history(i);$('phaseName').textContent=state.phase.toUpperCase();$('clock').textContent=clocks[state.phase];$('roleButton').textContent=isAudience()?'My predictions':'My role';}
function availableChannels(){return isAudience()?['match','audience']:state.view==='mafia'&&state.phase==='night'?['match','mafia']:['match'];}
function canWrite(){if(state.channel==='audience')return isAudience();if(state.channel==='mafia')return state.view==='mafia'&&state.phase==='night';if(isAudience())return false;return ['discussion','accusation'].includes(state.phase)||(state.phase==='defense'&&state.view==='accused');}
function renderChat(){const channels=availableChannels();if(!channels.includes(state.channel))state.channel='match';$('chatTabs').replaceChildren(...channels.map(channel=>{const b=document.createElement('button');b.className='tab';b.type='button';b.setAttribute('role','tab');b.setAttribute('aria-selected',String(channel===state.channel));b.textContent=channel==='mafia'?'Mafia · private':channel[0].toUpperCase()+channel.slice(1);b.onclick=()=>{state.channel=channel;renderChat();};return b;}));$('chatHeading').textContent=state.channel==='match'?'MATCH CHAT':state.channel==='audience'?'AUDIENCE CHAT':'PRIVATE MAFIA CHAT';$('viewLabel').textContent=isAudience()?'Audience':state.view==='gallery'?'Gallery':'Cast';const nodes=chats[state.channel].map(m=>{const a=document.createElement('article');a.className='message';if(m.event){a.classList.add('eventLine');a.textContent=m.event;return a;}const h=document.createElement('header');const b=document.createElement('button');b.type='button';b.textContent=m.who+(removed.has(m.seat)?' · gallery':'');if(m.seat!==undefined)b.onclick=()=>history(m.seat);else b.disabled=true;const t=document.createElement('time');t.textContent=m.time;h.append(b,t);const p=document.createElement('p');p.textContent=m.text;a.append(h,p);return a;});$('messages').replaceChildren(...nodes);const writable=canWrite();$('messageInput').disabled=!writable;$('send').disabled=!writable;$('messageInput').maxLength=state.phase==='defense'?500:240;$('messageInput').placeholder=writable?(state.phase==='defense'?'Write your defense…':'Write a message…'):'Read-only in this view';$('chatNotice').textContent=state.channel==='audience'?'The cast cannot access this audience channel.':state.channel==='mafia'?'Private night discussion. Excluded from public replay.':isAudience()?'Watch the cast here. Join Audience Chat to discuss.':state.view==='gallery'?'Gallery: join public discussion; no vote or night power.':writable?'Your accepted messages become part of public match history.':'Public writing resumes at the next discussion.';}
function actionButton(text,fn,kind='primary',disabled=false){const b=document.createElement('button');b.type='button';b.className=kind;b.textContent=text;b.disabled=disabled;b.onclick=fn;$('actions').append(b);}
function submitChoice(kind,label){state.choice=kind;note(`${label} accepted in this local study. Production requires an authoritative acknowledgement.`);renderAction();}
function renderAction(){const title=$('actionTitle'),hint=$('actionHint');$('actions').replaceChildren();title.textContent='Read the room.';hint.textContent='Select a portrait to inspect public history.';const legal=!removed.has(state.selected)&&state.selected!==ownSeat();if(isAudience()){if(['discussion','accusation','defense'].includes(state.phase)){title.textContent='Your round 3 prediction';hint.textContent=state.prediction===null?'One locked guess. Correctness is revealed after the match.':`Locked: ${names[state.prediction]}. Result stays hidden.`;actionButton(`Predict ${names[state.selected]}`,()=>{state.prediction=state.selected;note('Prediction locked. Correctness stays hidden until the finale.');renderAction();},'primary',state.prediction!==null||removed.has(state.selected));}else{title.textContent=state.phase==='finale'?'Your prediction result':'Follow the trial.';hint.textContent=state.phase==='finale'?(state.prediction===null?'No prediction submitted in this study.':`${names[state.prediction]} was ${memberRole(state.prediction)==='Mafia'?'Mafia — correct':'Citizen-aligned — incorrect'}.`):'Predictions are closed. Audience choices never remove a member.';}return;}
if(state.view==='gallery'){title.textContent='You are in the gallery.';hint.textContent='Help in discussion. Your vote and night powers are finished.';return;}
if(state.phase==='accusation'){title.textContent='Choose one member to accuse.';hint.textContent=state.choice?'Choice accepted; changes are allowed until the deadline.':'Your accusation is hidden until the deadline.';actionButton(`Accuse ${names[state.selected]}`,()=>submitChoice('accuse','Accusation'),'primary',!legal);actionButton('Abstain',()=>submitChoice('abstain','Abstention'),'outline');}
if(state.phase==='defense'){title.textContent=state.view==='accused'?'Make your defense.':'Hear NaKyoung’s defense.';hint.textContent=state.view==='accused'?'Use the Match Chat composer.':'Only the accused may write during this phase.';}
if(state.phase==='verdict'){title.textContent='NaKyoung is on trial.';hint.textContent=state.choice?`Your verdict: ${state.choice}. You can change it until the deadline.`:'Remove must receive more votes than Spare. Ties spare.';actionButton('Remove badge',()=>submitChoice('Remove','Verdict'),'danger');actionButton('Spare',()=>submitChoice('Spare','Verdict'),'outline');}
if(state.phase==='night'){const roleActions={detective:['Investigate','Investigation'],doctor:['Protect','Protection'],mafia:['Attack','Attack']};const pair=roleActions[state.view];title.textContent=pair?`${pair[0]} one member.`:'Night is in progress.';hint.textContent=pair?'Your target and action remain private.':'Review public history while night actions resolve.';if(pair){const validTarget=!removed.has(state.selected)&&(state.view==='doctor'||state.selected!==ownSeat())&&(state.view!=='mafia'||!mafiaFixture.has(state.selected));actionButton(`${pair[0]} ${names[state.selected]}`,()=>{state.nightAction={kind:state.view,target:state.selected};note(`${pair[1]} submitted privately. Effects resolve at morning.`);},'primary',!validTarget);}}
if(state.phase==='morning'){title.textContent='Morning arrives.';hint.textContent='Sample public outcome: nobody lost their badge. The cause stays hidden.';if(state.view==='detective'&&state.nightAction?.kind==='detective')actionButton('Private result',()=>dialog('Private investigation',names[state.nightAction.target],memberRole(state.nightAction.target)==='Mafia'?'Mafia':'Citizen'),'outline');}
if(state.phase==='finale'){title.textContent='Final reveal · presentation fixture';hint.textContent='Roles are shown to illustrate the ending. This study does not calculate a winner.';actionButton('View sample recap',()=>dialog('Public archive','The courtroom, replayed','A real recap will follow recorded accusations, verdicts, removals, and final results. This study contains no completed game or minted badges.'),'outline');}}
function render(){renderStage();renderChat();renderAction();}
$('phase').onchange=e=>{state.phase=e.target.value;state.choice=null;note('');render();};
$('perspective').onchange=e=>{state.view=e.target.value;state.channel='match';state.choice=null;state.nightAction=null;$('messageInput').value='';if($('detailDialog').open)$('detailDialog').close();note('');render();};
$('next').onclick=()=>{const i=phases.indexOf(state.phase);$('phase').value=phases[(i+1)%phases.length];$('phase').dispatchEvent(new Event('change'));};
$('roleButton').onclick=()=>{if(isAudience())dialog('Audience participation','Your predictions',state.prediction===null?'No prediction locked in this study.':'Locked target: '+names[state.prediction]+'. Correctness is hidden until the finale.');else dialog('Private role',state.view==='gallery'?'Citizen · gallery':state.view==='accused'?'Citizen':state.view[0].toUpperCase()+state.view.slice(1),state.view==='detective'?'Investigate one other active member at night. You belong to the Citizens.':state.view==='doctor'?'Protect one active member at night. You belong to the Citizens.':state.view==='mafia'?'Coordinate privately with active Mafia at night. This is a fixture view.':'Help identify Mafia through public discussion. Roles remain secret until the finale.');};
$('composer').onsubmit=e=>{e.preventDefault();const input=$('messageInput');const content=input.value.trim();if(!canWrite()||!content)return;chats[state.channel].push({who:isAudience()?'You · audience':names[ownSeat()],seat:isAudience()?undefined:ownSeat(),text:content,time:'now'});input.value='';renderChat();$('messages').scrollTop=$('messages').scrollHeight;};
function mobile(panel){state.panel=panel;$('workspace').dataset.panel=panel;$('courtNav').setAttribute('aria-selected',String(panel==='court'));$('chatNav').setAttribute('aria-selected',String(panel==='chat'));}
$('courtNav').onclick=()=>mobile('court');$('chatNav').onclick=()=>mobile('chat');
render();
</script>
</body>
</html>
